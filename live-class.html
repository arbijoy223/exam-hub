<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam Hub • Live Class</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{font-family:system-ui,'Noto Sans Bengali',sans-serif;color:#172033;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:24px}.head,.panel,.class{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #18264a0a}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:#64748b;font-size:13px}button,input,textarea{font:inherit}button{border:0;border-radius:10px;background:#5146df;color:#fff;padding:10px 15px;font-weight:700;cursor:pointer}button.secondary{background:#e9eafc;color:#4036b5}button.danger{background:#dc2626}input,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0 12px}label{font-weight:700;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.class{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{font-size:11px;border-radius:30px;padding:5px 9px;background:#e9f9ef;color:#167443}.actions{display:flex;gap:8px;flex-wrap:wrap}#room{display:none}#video{width:100%;max-height:65vh;background:#101827;border-radius:14px;min-height:260px;object-fit:contain}#status{padding:10px;border-radius:10px;background:#eef2ff;margin:10px 0}#error{color:#b91c1c;white-space:pre-wrap}@media(max-width:650px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.class,.head{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header class="head"><div><h2 style="margin:0">🎥 Exam Hub Live Class</h2><div class="muted">Teacher live • Student view • 50 viewers target</div></div><button class="secondary" onclick="location.href='index.html'">← Exam Hub</button></header>
<section class="panel"><strong id="who">অ্যাকাউন্ট যাচাই হচ্ছে…</strong><div class="muted" id="role"></div><div id="error"></div></section>
<section class="panel" id="createPanel" hidden><h3>নতুন লাইভ ক্লাস তৈরি</h3><label>ক্লাসের নাম</label><input id="title" placeholder="যেমন: ICT অধ্যায় ২ — লাইভ ক্লাস"><label>বিবরণ (ঐচ্ছিক)</label><textarea id="description" rows="2" placeholder="ক্লাস সম্পর্কে সংক্ষিপ্ত তথ্য"></textarea><label>শুরুর সময় (ঐচ্ছিক)</label><input id="schedule" type="datetime-local"><button id="createBtn">ক্লাস তৈরি করো</button></section>
<section class="panel"><h3>লাইভ ও আসন্ন ক্লাস</h3><div id="classes">লোড হচ্ছে…</div></section>
<section class="panel" id="room"><h3 id="roomTitle">লাইভ ক্লাস</h3><div id="status">কানেক্ট হচ্ছে…</div><video id="video" autoplay playsinline controls></video><div class="actions" style="margin-top:12px"><button class="secondary" id="leaveBtn">ক্লাস থেকে বের হও</button></div></section>
</main><script type="module">
import {Room,RoomEvent,Track} from 'https://cdn.jsdelivr.net/npm/livekit-client@2/+esm';
const SUPABASE_URL='https://mjsdwhwigzqzdtataaqy.supabase.co';
const SUPABASE_KEY='sb_publishable_jafSOckq1PsH_hiIwynFLQ_jm69LYGc';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let profile=null,room=null;
const $=id=>document.getElementById(id);const err=m=>$('error').textContent=m;
async function invoke(body){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('আগে Exam Hub-এ লগইন করো।');const {data,error}=await sb.functions.invoke('live-class',{body,headers:{Authorization:`Bearer ${session.access_token}`}});if(error)throw error;if(data?.error)throw Error(data.error);return data;}
async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user){$('who').textContent='লগইন করা নেই';$('classes').textContent='লাইভ ক্লাস দেখতে Exam Hub-এ লগইন করে আবার এখানে আসো।';return;}
const {data:p,error}=await sb.from('profiles').select('username,is_admin,blocked').eq('user_id',user.id).single();if(error||!p||p.blocked){err('প্রোফাইল যাচাই করা যায়নি।');return;}profile=p;$('who').textContent=`স্বাগতম, ${p.username}`;$('role').textContent=p.is_admin?'Teacher / Admin':'Student';$('createPanel').hidden=!p.is_admin;await loadClasses();}
async function loadClasses(){const {data,error}=await sb.from('live_classes').select('*').order('created_at',{ascending:false}).limit(30);if(error){$('classes').textContent=error.message;return;}if(!data?.length){$('classes').textContent='এখনও কোনো ক্লাস তৈরি হয়নি।';return;}$('classes').innerHTML='';for(const c of data){const el=document.createElement('article');el.className='class';const left=document.createElement('div');left.innerHTML=`<strong></strong><div class="muted"></div><span class="pill"></span>`;left.querySelector('strong').textContent=c.title;left.querySelector('.muted').textContent=c.description||'লাইভ ক্লাস';left.querySelector('.pill').textContent=c.status==='live'?'LIVE':c.status==='ended'?'শেষ হয়েছে':'আসন্ন';const actions=document.createElement('div');actions.className='actions';if(c.status==='live'){const join=document.createElement('button');join.textContent=profile.is_admin?'লাইভে প্রবেশ':'Join Live';join.onclick=()=>joinClass(c);actions.append(join);}if(profile.is_admin){if(c.status==='scheduled'){const start=document.createElement('button');start.textContent='Start Live';start.onclick=()=>startClass(c);actions.append(start);}if(c.status==='live'){const end=document.createElement('button');end.className='danger';end.textContent='End Live';end.onclick=()=>endClass(c);actions.append(end);}}el.append(left,actions);$('classes').append(el);}}
$('createBtn').onclick=async()=>{try{$('createBtn').disabled=true;const scheduled_at=$('schedule').value?new Date($('schedule').value).toISOString():null;await invoke({action:'create-class',title:$('title').value,description:$('description').value,scheduled_at});$('title').value='';$('description').value='';await loadClasses();}catch(e){err(e.message)}finally{$('createBtn').disabled=false}};
async function startClass(c){try{await invoke({action:'start-class',classId:c.id});await loadClasses();await joinClass({...c,status:'live'});}catch(e){err(e.message)}}
async function joinClass(c){try{const data=await invoke({action:'token',classId:c.id});$('room').style.display='block';$('roomTitle').textContent=data.title;$('status').textContent=data.role==='teacher'?'তোমার ক্যামেরা ও মাইক্রোফোন চালু হচ্ছে…':'লাইভ ক্লাসে যুক্ত হচ্ছ…';room=new Room({adaptiveStream:true,dynacast:true});room.on(RoomEvent.TrackSubscribed,(track)=>{if(track.kind===Track.Kind.Video){const v=track.attach();$('video').replaceWith(v);v.id='video';v.autoplay=true;v.playsInline=true;}if(track.kind===Track.Kind.Audio){track.attach();}});room.on(RoomEvent.Disconnected,()=>{$('status').textContent='ক্লাস সংযোগ বিচ্ছিন্ন হয়েছে।'});await room.connect(data.url,data.token);if(data.role==='teacher'){await room.localParticipant.setCameraEnabled(true);await room.localParticipant.setMicrophoneEnabled(true);$('status').textContent='তুমি লাইভে আছো। শিক্ষার্থীরা এখন দেখতে পারবে।';}else{$('status').textContent='লাইভ ক্লাসে যুক্ত হয়েছো।';}window.scrollTo({top:$('room').offsetTop,behavior:'smooth'});}catch(e){err(e.message)}}
async function endClass(c){try{await invoke({action:'end-class',classId:c.id});if(room){await room.disconnect();room=null;}$('room').style.display='none';await loadClasses();}catch(e){err(e.message)}}
$('leaveBtn').onclick=async()=>{if(room){await room.disconnect();room=null;}$('room').style.display='none'};boot().catch(e=>err(e.message));
</script></body></html>
